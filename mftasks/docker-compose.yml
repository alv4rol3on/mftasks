services:
  backend:
    build:
      context: ./BACKEND/mfbackend
      dockerfile: dockerfile

    container_name: mf-backend

    working_dir: /app

    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 mfbackend.asgi:application"

    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_ALLOWED_DOMAINS: ""

      # Microsoft Graph - correo
      MAIL_TENANT_ID: ${MAIL_TENANT_ID}
      MAIL_CLIENT_ID: ${MAIL_CLIENT_ID}
      MAIL_CLIENT_SECRET: ${MAIL_CLIENT_SECRET}
      MAIL_SENDER: ${MAIL_SENDER}

    volumes:
      - ./BACKEND/mfbackend:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

  
  frontend:
    build:
      context: ./FRONTEND/mffrontend/my-app
      dockerfile: Dockerfile

    container_name: mf-frontend
    working_dir: /app

    command: >
      npm run dev --
      --hostname 0.0.0.0
      --experimental-https
      --experimental-https-key /certs/server.key
      --experimental-https-cert /certs/server.crt

    volumes:
      - ./FRONTEND/mffrontend/my-app:/app
      - /app/node_modules
      - ./certs:/certs:ro

    ports:
      - "3000:3000"

    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_CLIENT_ID: ${NEXT_PUBLIC_CLIENT_ID}
      NEXT_PUBLIC_TENANT_ID: ${NEXT_PUBLIC_TENANT_ID}
      NEXT_PUBLIC_REDIRECT_URI: ""
      NEXT_PUBLIC_API_URL: ""
      BACKEND_INTERNAL_URL: http://backend:8000

    depends_on:
      - backend

