services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: mf-valkey
    command: valkey-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  backend:
    build:
      context: ./BACKEND/mfbackend
      dockerfile: Dockerfile

    container_name: mf-backend

    working_dir: /app

    command: daphne -b 0.0.0.0 -p 8000 mfbackend.asgi:application

    environment:
      AZURE_TENANT_ID: 8d669035-9c23-4bfe-8439-816c8408e589
      AZURE_CLIENT_ID: 10a3c5ce-2a51-456e-8bc2-6256f4720848
      AZURE_ALLOWED_DOMAINS: ""
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379

    volumes:
      - ./BACKEND/mfbackend:/app
      # db.sqlite3 persiste vía bind mount del host; no usar volumen nombrado sobre archivo

    ports:
      - "8000:8000"
    depends_on:
      valkey:
        condition: service_healthy

  frontend:
    build:
      context: ./FRONTEND/mffrontend/my-app
      dockerfile: Dockerfile

    container_name: mf-frontend

    working_dir: /app

    command: npm run dev

    volumes:
      - ./FRONTEND/mffrontend/my-app:/app
      - /app/node_modules

    ports:
      - "3000:3000"

    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_CLIENT_ID: 10a3c5ce-2a51-456e-8bc2-6256f4720848
      NEXT_PUBLIC_TENANT_ID: 8d669035-9c23-4bfe-8439-816c8408e589
      NEXT_PUBLIC_REDIRECT_URI: http://localhost:3000

    depends_on:
      - backend
volumes:
  valkey_data: