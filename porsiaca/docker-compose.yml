services:
  backend:
    build:
      context: ./BACKEND/mfbackend
      dockerfile: dockerfile

    container_name: mf-backend

    working_dir: /app

    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 mfbackend.asgi:application"

    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,192.168.202.10,192.168.202.12}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}

      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_ALLOWED_DOMAINS: ${AZURE_ALLOWED_DOMAINS:-}

      # Microsoft Graph - correo
      MAIL_TENANT_ID: ${MAIL_TENANT_ID}
      MAIL_CLIENT_ID: ${MAIL_CLIENT_ID}
      MAIL_CLIENT_SECRET: ${MAIL_CLIENT_SECRET}
      MAIL_SENDER: ${MAIL_SENDER}

    volumes:
      - ./BACKEND/mfbackend:/app

    # El backend no necesita exponerse en la LAN: Next lo proxyfica.
    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env
 
  frontend:
    build:
      context: ./FRONTEND/mffrontend/my-app
      dockerfile: Dockerfile

    container_name: mf-frontend
    working_dir: /app

    command: >
      npm run dev --
      --hostname 0.0.0.0
      --experimental-https
      --experimental-https-key /certs/server.key
      --experimental-https-cert /certs/server.crt

    volumes:
      - ./FRONTEND/mffrontend/my-app:/app
      - /app/node_modules
      - ./certs:/certs:ro

    ports:
      - "3000:3000"

    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_CLIENT_ID: ${NEXT_PUBLIC_CLIENT_ID}
      NEXT_PUBLIC_TENANT_ID: ${NEXT_PUBLIC_TENANT_ID}
      NEXT_PUBLIC_REDIRECT_URI: ""
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      NEXT_PUBLIC_WS_SAME_ORIGIN: ${NEXT_PUBLIC_WS_SAME_ORIGIN:-false}
      BACKEND_INTERNAL_URL: http://backend:8000

    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: mf-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

    depends_on:
      - frontend
      - backend